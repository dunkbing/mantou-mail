name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Types and headless tests · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: (Linux) Install Mesa (software Vulkan for headless captures)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: bun install --frozen-lockfile # mantou-ui ships a prebuilt native core per platform
      - run: bun run typecheck
      - run: bun test
